<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0040D0"/>
    </linearGradient>

    <!-- Green Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E59B"/>
      <stop offset="50%" stop-color="#00D287"/>
      <stop offset="100%" stop-color="#00B870"/>
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D6E8FF"/>
    </linearGradient>

    <!-- Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC000"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>

    <!-- Mountain Gradient 1 -->
    <linearGradient id="mnt1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Mountain Gradient 2 -->
    <linearGradient id="mnt2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadowCard" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#001F66" flood-opacity="0.35"/>
    </filter>
    <filter id="shadowBadge" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#001A52" flood-opacity="0.4"/>
    </filter>
    <filter id="shadowArrow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#00297A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Blue Rounded Squircle App Icon Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Inner Soft Highlight -->
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="5"/>

  <!-- Top-Left Photo Card -->
  <g filter="url(#shadowCard)">
    <rect x="45" y="72" width="280" height="280" rx="42" fill="#FFFFFF"/>
    
    <!-- Clip area inside photo card -->
    <g clip-path="url(#photoCardClip)">
      <clipPath id="photoCardClip">
        <rect x="45" y="72" width="280" height="280" rx="42"/>
      </clipPath>
      
      <!-- Folded Top-Right Corner Effect -->
      <path d="M245 72 L325 152 L245 152 Z" fill="#E2E8F0"/>
      <path d="M245 72 L325 152 L260 152 C251.7 152 245 145.3 245 137 Z" fill="#CBD5E1"/>

      <!-- Sun -->
      <circle cx="118" cy="154" r="36" fill="url(#sunGrad)"/>

      <!-- Back Mountain (Darker Blue) -->
      <path d="M110 352 L225 162 L325 352 Z" fill="url(#mnt1)"/>

      <!-- Front Mountain (Lighter Blue) -->
      <path d="M45 352 L115 210 L230 352 Z" fill="url(#mnt2)"/>
    </g>
  </g>

  <!-- Curved Downward-Pointing Arrow -->
  <g filter="url(#shadowArrow)">
    <path d="M312 105 C365 105 425 140 450 195 C460 216 466 242 468 268" fill="none" stroke="url(#arrowGrad)" stroke-width="32" stroke-linecap="round"/>
    <!-- Arrowhead -->
    <path d="M418 248 L468 322 L490 238 Z" fill="url(#arrowGrad)"/>
  </g>

  <!-- Foreground Green "PNG" Pill Badge -->
  <g filter="url(#shadowBadge)">
    <rect x="150" y="250" width="340" height="175" rx="56" fill="url(#badgeGrad)"/>
    <rect x="152" y="252" width="336" height="171" rx="54" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4"/>
    
    <!-- Bold PNG Typography -->
    <text x="320" y="378" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="124" fill="#FFFFFF" letter-spacing="1">PNG</text>
  </g>
</svg>